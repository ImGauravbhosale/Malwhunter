name: "MalwHunter Dependency Scan"
description: >-
  Hunts for malware deliberately hidden in npm dependencies — static
  Recon + an AI second opinion + sandboxed Detonation with canary
  tripwires — and fails the job on a real finding.
author: "Gaurav Bhosale"
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Subdirectory to scan, relative to the checked-out repo (leave empty to scan the repo root)"
    required: false
    default: ""
  fail-on:
    description: "Fail the job on this verdict level or worse: malicious, suspicious, none"
    required: false
    default: "malicious"
  detonate:
    description: "Detonation mode: smart (default, reputation-gated — fast), always, never"
    required: false
    default: "smart"
  ai:
    description: >-
      Let the Analyst review ambiguous findings. Needs an authenticated
      `claude` CLI session, which most CI runners don't have — defaults
      off so the scan degrades intentionally, not silently.
    required: false
    default: "false"
  format:
    description: "Report format: json, markdown, terminal"
    required: false
    default: "json"

outputs:
  report-path:
    description: "Absolute path to the written report file"
    value: ${{ steps.scan.outputs.report-path }}
  verdict-summary:
    description: "One-line pass/fail summary"
    value: ${{ steps.scan.outputs.verdict-summary }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
      with:
        python-version: "3.12"

    - name: Install MalwHunter
      shell: bash
      working-directory: ${{ github.action_path }}
      run: uv sync --no-dev

    - name: Run scan
      id: scan
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_AI: ${{ inputs.ai }}
        INPUT_DETONATE: ${{ inputs.detonate }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        set +e

        # The scan target is the CALLING repo's checkout
        # ($GITHUB_WORKSPACE), never this action's own installed
        # location — github.action_path is only where MalwHunter itself
        # lives, not what it should scan.
        #
        # Inputs are read from env vars (set above), not interpolated
        # directly into this script via ${{ }} — template substitution
        # happens before the shell ever sees the script, so an input
        # containing shell metacharacters could otherwise inject
        # arbitrary commands.
        if [ -z "$INPUT_PATH" ]; then
          SCAN_PATH="$GITHUB_WORKSPACE"
        else
          SCAN_PATH="$GITHUB_WORKSPACE/$INPUT_PATH"
        fi

        AI_FLAG="--no-ai"
        if [ "$INPUT_AI" = "true" ]; then AI_FLAG="--ai"; fi

        DETONATE_FLAG=""
        if [ "$INPUT_DETONATE" = "never" ]; then DETONATE_FLAG="--no-detonate"; fi
        if [ "$INPUT_DETONATE" = "always" ]; then DETONATE_FLAG="--always-detonate"; fi

        REPORT="$RUNNER_TEMP/malwhunter-report.$INPUT_FORMAT"

        uv run malwhunter scan "$SCAN_PATH" \
          $AI_FLAG \
          $DETONATE_FLAG \
          --fail-on "$INPUT_FAIL_ON" \
          --format "$INPUT_FORMAT" \
          --out "$REPORT"
        CODE=$?

        echo "report-path=$REPORT" >> "$GITHUB_OUTPUT"
        if [ $CODE -eq 0 ]; then
          echo "verdict-summary=no findings at or above '$INPUT_FAIL_ON'" >> "$GITHUB_OUTPUT"
          echo "::notice::MalwHunter: no findings at or above '$INPUT_FAIL_ON'"
        else
          echo "verdict-summary=findings at or above '$INPUT_FAIL_ON' — see the report" >> "$GITHUB_OUTPUT"
          echo "::error::MalwHunter found a dependency at or above '$INPUT_FAIL_ON' — see $REPORT"
        fi

        exit $CODE
