[project]
name = "malwhunter"
version = "0.1.0"
description = "Supply-chain package malware hunter — static Recon + sandboxed Detonation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.0",
]

[project.scripts]
malwhunter = "malwhunter.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["malwhunter"]
